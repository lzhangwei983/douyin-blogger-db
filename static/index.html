<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音博主数据库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e11'/%3E%3Crect x='1' y='1' width='30' height='30' rx='6' fill='none' stroke='%2337b6e6' stroke-opacity='0.35'/%3E%3Cpath d='M9 20c1.5 0 1.5-2 3-2s1.5 2 3 2 1.5-2 3-2 1.5 2 3 2' fill='none' stroke='%2337b6e6' stroke-width='1.6' stroke-linecap='round'/%3E%3Cpath d='M12 14l1.6-3 1.6 2.4L17.6 10l1.6 3.2' fill='none' stroke='%2337b6e6' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ============================================================
   抖音博主数据库 — design tokens & base styles
   "Restrained, precise, minimal observability terminal"
   与 OpenCode Token Observatory 同一设计语言
   ============================================================ */
:root {
  --radius-card: 6px;
  --radius-control: 6px;
  --radius-pill: 999px;
  --font-sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", "PingFang SC",
    "Microsoft YaHei", sans-serif;
  --font-mono: "Cascadia Code", "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono",
    monospace;
  --t-fast: 120ms;
  --t-base: 180ms;
  --t-slow: 240ms;
  --duration-fast: var(--t-fast);
  --duration-base: var(--t-base);
  --duration-slow: var(--t-slow);
  --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --z-tooltip: 60;
  --z-menu: 50;
  --z-topbar: 40;
  --z-overlay: 70;
}

:root[data-mode="dark"] {
  --bg: #0b0e11;
  --bg-elevated: #10151a;
  --panel: #12171d;
  --panel-hover: #161c23;
  --border: #232b34;
  --border-strong: #2f3a46;
  --text: #e4eaf1;
  --text-secondary: #93a1af;
  --text-muted: #5c6a78;
  --text-faint: #46525f;
  --accent: #37b6e6;
  --accent-strong: #5ecbf2;
  --accent-soft: rgba(55, 182, 230, 0.12);
  --accent-border: rgba(55, 182, 230, 0.35);
  --amber: #e0af68;
  --amber-soft: rgba(224, 175, 104, 0.12);
  --amber-border: rgba(224, 175, 104, 0.35);
  --danger: #f7768e;
  --danger-soft: rgba(247, 118, 142, 0.12);
  --ok: #9ece6a;
  --ok-soft: rgba(158, 206, 106, 0.12);
  --shadow-panel: 0 1px 2px rgba(0, 0, 0, 0.35);
  --tooltip-bg: #1a2129;
  --tooltip-border: #2f3a46;
  --grid-dot: rgba(140, 165, 190, 0.07);
  color-scheme: dark;
}

:root[data-mode="light"] {
  --bg: #f2f4f7;
  --bg-elevated: #ffffff;
  --panel: #ffffff;
  --panel-hover: #f6f8fa;
  --border: #d9e0e8;
  --border-strong: #c3ccd6;
  --text: #161d26;
  --text-secondary: #4d5a69;
  --text-muted: #7a8694;
  --text-faint: #9aa5b1;
  --accent: #0b8fb8;
  --accent-strong: #087aa0;
  --accent-soft: rgba(11, 143, 184, 0.09);
  --accent-border: rgba(11, 143, 184, 0.4);
  --amber: #a86a10;
  --amber-soft: rgba(168, 106, 16, 0.1);
  --amber-border: rgba(168, 106, 16, 0.4);
  --danger: #c43d5a;
  --danger-soft: rgba(196, 61, 90, 0.08);
  --ok: #4c8f2b;
  --ok-soft: rgba(76, 143, 43, 0.1);
  --shadow-panel: 0 1px 2px rgba(20, 30, 45, 0.06);
  --tooltip-bg: #ffffff;
  --tooltip-border: #c3ccd6;
  --grid-dot: rgba(80, 105, 130, 0.14);
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(circle at 1px 1px, var(--grid-dot) 1px, transparent 0) 0 0 / 22px 22px,
    var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: var(--accent-soft); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }
a { color: var(--accent-strong); text-decoration: none; }
a:hover { text-decoration: underline; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.daily-meta { color: var(--text-muted); font-size: 11px; margin-top: 3px; padding-right: 64px; }
.daily-summary { color: var(--text-secondary); font-size: 12px; line-height: 1.55; margin-top: 5px; background: var(--panel-hover); border-radius: 8px; padding: 6px 10px; }
.daily-summary.dim { color: var(--text-muted); }
.progress-bar { height: 10px; background: var(--panel-hover); border-radius: 6px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #22c55e); border-radius: 6px; transition: width .6s ease; }
.pill { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
.pill-ok { background: rgba(34,197,94,.15); color: #22c55e; }
.pill-muted { background: var(--panel-hover); color: var(--text-muted); }
.dv-title { font-size: 20px; font-weight: 700; line-height: 1.4; margin: 10px 0 0; color: var(--text); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ============================================================
   Top bar
   ============================================================ */
.topbar {
  position: sticky;
  top: 0;
  z-index: var(--z-topbar);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1440px;
  margin: 0 auto;
  padding: 10px 24px;
  display: flex;
  align-items: center;
  gap: 10px 20px;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand-mark {
  width: 26px; height: 26px;
  border-radius: var(--radius-control);
  display: grid; place-items: center;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid var(--accent-border);
  flex: none;
}
.brand-title { font-size: 14px; font-weight: 600; letter-spacing: 0.01em; white-space: nowrap; }
.brand-sub { font-size: 11.5px; color: var(--text-muted); font-family: var(--font-mono); white-space: nowrap; }
.topbar-spacer { flex: 1; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.topbar-divider { width: 1px; height: 20px; background: var(--border-strong); margin: 0 6px; flex: none; }
.topbar-actions select.ctl { min-width: 64px; }

/* status pill */
.status-pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: var(--panel);
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex: none; }
.status-dot.ok { background: var(--ok); }
.status-dot.warn { background: var(--amber); }
.status-dot.err { background: var(--danger); }
.status-dot.busy { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.status-label { font-weight: 500; }
.last-updated {
  font-size: 12px; color: var(--text-muted);
  font-family: var(--font-mono);
  white-space: nowrap;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ============================================================
   Controls & buttons
   ============================================================ */
.ctl {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px;
  border-radius: var(--radius-control);
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text-secondary);
  font: inherit; font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--duration-fast) ease, border-color var(--duration-fast) ease, color var(--duration-fast) ease;
}
.ctl:hover { background: var(--panel-hover); border-color: var(--border-strong); color: var(--text); }
.ctl:focus-visible, .btn:focus-visible, .seg:focus-visible,
select:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
.ctl.on { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent-strong); }
.ctl:disabled { opacity: 0.45; cursor: not-allowed; }
.ctl-icon { width: 15px; height: 15px; flex: none; }
select.ctl {
  appearance: none;
  padding-right: 26px;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%),
    linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 12px, calc(100% - 10px) 12px;
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 32px; min-width: 32px; padding: 0 14px;
  border-radius: var(--radius-control);
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text-secondary);
  font: inherit; font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--duration-fast) ease, border-color var(--duration-fast) ease, color var(--duration-fast) ease;
}
.btn:hover { background: var(--panel-hover); color: var(--text); }
.btn.primary { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent-strong); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #0b0e11; }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
.btn.spin .ctl-icon { animation: spin 0.9s linear infinite; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.mini { height: 24px; min-width: 24px; padding: 0 6px; font-size: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* segmented control */
.seg-group {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: var(--radius-control);
  overflow: hidden;
  background: var(--panel);
}
.seg {
  height: 30px; padding: 0 10px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font: inherit; font-size: 12.5px;
  cursor: pointer;
  border-right: 1px solid var(--border);
  transition: background var(--duration-fast) ease, color var(--duration-fast) ease;
  white-space: nowrap;
}
.seg:last-child { border-right: none; }
.seg:hover { color: var(--text); background: var(--panel-hover); }
.seg.active { background: var(--accent-soft); color: var(--accent-strong); }

/* search input */
.search-input {
  height: 30px; padding: 0 10px;
  border-radius: var(--radius-control);
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  font: inherit; font-size: 12.5px;
  min-width: 180px;
  transition: border-color var(--duration-fast) ease;
}
.search-input::placeholder { color: var(--text-faint); }
.search-input:focus { border-color: var(--accent-border); outline: none; }

/* ============================================================
   Layout & panels
   ============================================================ */
.app-main {
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding: 16px 24px 48px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-panel);
}
.section-title {
  font-size: 12px; font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  display: flex; align-items: center; gap: 8px;
  margin: 0;
}
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-muted); }
.crumbs a { color: var(--text-secondary); }
.crumbs a:hover { color: var(--accent-strong); }

/* ============================================================
   Metric cards (fixed height, gradient top line)
   ============================================================ */
.metrics-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1100px) { .metrics-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .metrics-grid { grid-template-columns: minmax(0, 1fr); } }
.metric-card {
  padding: 16px 18px;
  height: 110px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}
.metric-card::before {
  content: "";
  position: absolute;
  top: 0; left: 18px; right: 18px;
  height: 2px;
  border-radius: 0 0 2px 2px;
  background: linear-gradient(90deg, transparent, var(--accent-soft), transparent);
  pointer-events: none;
}
.metric-label {
  font-size: 11.5px;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  display: flex; align-items: center; gap: 6px;
  min-height: 16px;
}
.metric-value {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 30px; font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.metric-value.muted { color: var(--text-muted); }
.metric-card.em .metric-value { font-size: 34px; }
.metric-delta { font-size: 12px; font-family: var(--font-mono); color: var(--text-muted); min-height: 16px; white-space: nowrap; }
.metric-delta .up { color: var(--accent-strong); }
.metric-delta .warn { color: var(--amber); }

/* ============================================================
   Overview hero KPIs & platform sections
   ============================================================ */
.kpi-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 700px) { .kpi-grid { grid-template-columns: minmax(0, 1fr); } }
.kpi-hero { height: 148px; justify-content: center; gap: 10px; }
.kpi-hero .metric-value { font-size: 56px; }
.platform-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.platform-card { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-height: 92px; }
.platform-card.off { opacity: 0.55; }
.plat-badge {
  width: 30px; height: 30px;
  border-radius: var(--radius-control);
  display: grid; place-items: center;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid var(--accent-border);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  flex: none;
}
.plat-name { font-size: 13px; font-weight: 600; }
.plat-num { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }
.plat-head { display: flex; align-items: center; gap: 10px; }

/* ============================================================
   Blogger cards
   ============================================================ */
.blogger-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.blogger-card { padding: 16px 18px; cursor: pointer; transition: border-color var(--duration-base) ease, transform var(--duration-fast) ease; display: flex; flex-direction: column; gap: 12px; }
.blogger-card:hover { border-color: var(--accent-border); }
.blogger-card:active { transform: scale(0.995); }
.bc-head { display: flex; align-items: center; gap: 10px; }
.bc-avatar {
  width: 34px; height: 34px;
  border-radius: var(--radius-control);
  display: grid; place-items: center;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid var(--accent-border);
  flex: none;
}
.bc-name { font-size: 15px; font-weight: 600; }
.bc-sub { font-size: 11.5px; color: var(--text-muted); }
.bc-kpis { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-muted); }
.bc-kpis b { color: var(--text); font-family: var(--font-mono); font-weight: 600; }
.bc-range { font-size: 11.5px; color: var(--text-faint); font-family: var(--font-mono); }

/* ============================================================
   Detail head & meta grid
   ============================================================ */
.detail-head {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  flex-wrap: wrap;
  padding: 16px;
}
.detail-head .model-ident { flex: 1; min-width: 220px; }
.detail-head .model-ident h2 {
  margin: 4px 0 2px;
  font-size: 17px; font-weight: 600;
  letter-spacing: -0.01em;
  word-break: break-all;
}
.detail-head .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.detail-meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; padding: 0 16px 16px; }
.detail-meta { padding: 12px 14px; }
.detail-meta .k { font-size: 11.5px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
.detail-meta .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; word-break: break-all; }
.detail-meta .s { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
.bio-text { padding: 0 16px 16px; font-size: 12.5px; color: var(--text-secondary); white-space: pre-wrap; }
.bio-text .k { font-size: 11.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }

/* ============================================================
   Table
   ============================================================ */
.table-toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.table-toolbar .spacer { flex: 1; }
.table-wrap { overflow-x: auto; }
table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  position: sticky; top: 0; z-index: 2;
  background: var(--bg-elevated);
  color: var(--text-muted);
  font-size: 11.5px; font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  text-align: left;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-strong);
  white-space: nowrap;
  user-select: none;
}
.data-table th.rt, .data-table td.rt { text-align: right; }
.data-table td {
  padding: 7px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  color: var(--text);
}
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr { cursor: pointer; }
.data-table tbody tr:hover { background: var(--panel-hover); }
.data-table td.num-cell { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.data-table td .truncate { display: inline-block; max-width: 320px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
.data-table td .vcell { color: var(--text-secondary); }
.data-table td .unknown-cell { color: var(--text-faint); }
.data-table td .title-cell { color: var(--text); font-weight: 500; }
.data-table td .seq-cell { color: var(--text-faint); font-family: var(--font-mono); }
.data-table tfoot td { padding: 10px 12px; font-size: 12px; color: var(--text-muted); }
.provider-badge {
  font-size: 10.5px;
  padding: 1px 7px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-strong);
  color: var(--text-secondary);
  background: var(--panel);
  white-space: nowrap;
}
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.dot.ok { background: var(--ok); }
.dot.amber { background: var(--amber); }
.dot.faint { background: var(--text-faint); }

/* analysis sections */
.fmt-bar { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); align-items: center; }
.sec-body { padding: 16px; font-size: 13px; color: var(--text-secondary); white-space: pre-wrap; word-break: break-word; }
pre.raw {
  white-space: pre-wrap; word-break: break-word;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--text-secondary);
  max-height: 640px;
  overflow: auto;
}
.raw-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.raw-head .title { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }

/* ============================================================
   Empty / error / banner
   ============================================================ */
.empty { padding: 48px 20px; text-align: center; color: var(--text-muted); font-size: 12.5px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .empty-icon { color: var(--text-faint); }
.banner {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius-card);
  border: 1px solid var(--amber-border);
  background: var(--amber-soft);
  font-size: 12.5px;
  color: var(--amber);
}
.banner code { font-family: var(--font-mono); font-size: 12px; background: var(--tooltip-bg); padding: 1px 6px; border-radius: 4px; color: var(--text-secondary); }
.banner .spacer { flex: 1; }

/* ============================================================
   Modal
   ============================================================ */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(2px);
  z-index: var(--z-overlay);
  display: none;
  align-items: flex-start;
  justify-content: center;
  overflow: auto;
  padding: 48px 16px;
}
.overlay.show { display: flex; }
.modal {
  background: var(--panel);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-card);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  width: 100%;
  max-width: 560px;
  animation: popIn var(--duration-base) var(--ease-out);
}
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.modal-head h3 { font-size: 14px; font-weight: 600; }
.modal-body { padding: 16px 18px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); }
label.fld { font-size: 11.5px; color: var(--text-muted); display: block; margin: 12px 0 4px; letter-spacing: 0.03em; }
label.fld:first-child { margin-top: 0; }
input[type=text], input[type=number], textarea, select.fld {
  padding: 6px 10px;
  border-radius: var(--radius-control);
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  font: inherit;
  font-size: 12.5px;
  width: 100%;
}
textarea { resize: vertical; min-height: 80px; }
input:focus, textarea:focus, select.fld:focus { border-color: var(--accent-border); outline: none; }
.fld-hint { font-size: 11px; color: var(--text-faint); margin-top: 3px; }
.form-row { display: flex; gap: 10px; }
.form-row > div { flex: 1; }

/* menu (dropdown) */
.menu-wrap { position: relative; }
.menu {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  z-index: var(--z-menu);
  background: var(--tooltip-bg);
  border: 1px solid var(--tooltip-border);
  border-radius: var(--radius-control);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  padding: 6px;
  min-width: 190px;
  animation: popIn var(--duration-fast) var(--ease-out);
  display: none;
}
.menu.open { display: block; }
.menu-item {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 6px 8px;
  border: none; background: transparent;
  color: var(--text);
  font: inherit; font-size: 12.5px;
  border-radius: 4px;
  cursor: pointer;
  text-align: left;
}
.menu-item:hover { background: var(--panel-hover); }
.menu-item .check { width: 14px; color: var(--accent); flex: none; }
.menu-item .ic { width: 14px; color: var(--text-muted); flex: none; }
.menu-item:disabled { opacity: 0.45; cursor: not-allowed; }
.menu-sep { height: 1px; background: var(--border); margin: 5px 6px; }
.theme-item .theme-swatch {
  width: 26px; height: 18px;
  border-radius: 4px;
  border: 1px solid var(--border-strong);
  flex: none;
  display: inline-block;
}

@keyframes popIn {
  from { opacity: 0; transform: translateY(-4px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* toast */
.toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%);
  background: var(--tooltip-bg);
  border: 1px solid var(--tooltip-border);
  color: var(--text);
  padding: 9px 16px;
  border-radius: var(--radius-control);
  font-size: 12.5px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  z-index: 200;
  display: none;
  animation: popIn var(--duration-fast) var(--ease-out);
}

/* loading shimmer */
.skel { border-radius: var(--radius-card); }
.skel .skel-line {
  height: 12px; border-radius: 4px;
  background: linear-gradient(90deg, var(--panel) 25%, var(--panel-hover) 50%, var(--panel) 75%);
  background-size: 400% 100%;
  animation: shimmer 1.4s ease-in-out infinite;
  margin-bottom: 10px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    transition-duration: 1ms !important;
  }
}
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:900px){.topbar-actions{flex-wrap:wrap;width:100%;min-width:0}.last-updated,.daily-meta,.bc-sub{white-space:normal;overflow-wrap:anywhere}}
.metrics-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.metrics-filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-top:14px}
.metrics-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.metrics-field label,.metrics-label{font-size:12px;color:var(--text-muted)}
.metrics-field input,.metrics-field select,.metrics-account-search{height:34px;padding:0 10px;border-radius:var(--radius-control);border:1px solid var(--border);background:var(--panel);color:var(--text);font:inherit;font-size:13px;min-width:0}
.metrics-account-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:6px;max-height:190px;overflow:auto;padding:8px 2px}
.metrics-account-option{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;cursor:pointer;min-width:0}
.metrics-account-option:hover{background:var(--panel-hover)}
.metrics-account-option input,.metrics-video-select{accent-color:var(--accent)}
.metrics-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}
.metrics-summary-card{padding:16px;min-width:0}
.metrics-summary-card h3{font-size:14px;margin:0 0 5px;overflow-wrap:anywhere}
.metrics-summary-card .meta{color:var(--text-muted);font-size:12px;margin-bottom:12px}
.metrics-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.metrics-stat{border:1px solid var(--border);border-radius:9px;padding:9px}
.metrics-stat .k{font-size:11px;color:var(--text-muted)}
.metrics-stat .v{font-size:14px;font-weight:650;margin-top:3px;font-variant-numeric:tabular-nums}
.metrics-note{border:1px solid var(--amber-border);background:var(--amber-soft);border-radius:10px;padding:11px 13px;color:var(--text-secondary);font-size:12px;line-height:1.6}
.metrics-muted{color:var(--text-muted);font-size:12px}
.metrics-import-box{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:12px}
.metrics-import-box select,.metrics-import-box input:not([type=file]){height:36px;padding:0 10px;border-radius:var(--radius-control);border:1px solid var(--border);background:var(--panel);color:var(--text);font:inherit;font-size:13px;min-width:0}
.metrics-import-preview{padding:13px;margin-top:12px;min-width:0;overflow:hidden}
.metrics-import-preview .table-wrap{overflow:auto;max-width:100%}
.metrics-import-preview .data-table{min-width:680px}
.metrics-import-warnings{margin-top:10px;padding:10px 12px;border:1px solid var(--amber-border);background:var(--amber-soft);border-radius:8px;color:var(--text-secondary);font-size:12px}
.metrics-import-warnings ul{margin:5px 0 0;padding-left:18px;line-height:1.6}
.metrics-import-error{margin-top:10px;padding:10px 12px;border:1px solid var(--amber-border);border-radius:8px;color:var(--text-secondary);font-size:13px}
@media(max-width:600px){.metrics-card-grid{grid-template-columns:1fr}.metrics-filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

function hexToRgb(h) { const v = h.replace("#", "").padStart(6, "0"); const n = parseInt(v, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbToHex(r, g, b) { const c = n => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, "0"); return `#${c(r)}${c(g)}${c(b)}`; }
function mix(a, b, t) { const [ar, ag, ab] = hexToRgb(a), [br, bg, bb] = hexToRgb(b); return rgbToHex(ar + (br - ar) * t, ag + (bg - ag) * t, ab + (bb - ab) * t); }

  root.dataset.mode = core.mode;

async function doExport(format, bloggerId) {

    const url = `/api/export?format=${format}${bloggerId ? `&blogger_id=${bloggerId}` : ""}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error("导出失败（" + r.status + "）");
    const blob = await r.blob();
    const ext = format === "csv" ? "csv" : "json";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `douyin_blog_export_${new Date().toISOString().slice(0, 10)}.${ext}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast("已导出 " + format.toUpperCase());
  } catch (err) {
    toast(err.message);
  }
}
async function startDownload(id, btn) {
  try {
    const r = await api(`/videos/${id}/download`);
    const t = r.task_id;
    if (btn) { btn.disabled = true; btn.textContent = "…"; }
    const poll = setInterval(async () => {
      try {
        const st = await api(`/tasks/${t}`);
        if (st.status === "done") {
          clearInterval(poll);
          if (btn) { btn.disabled = false; btn.innerHTML = icon("download", 13); }
          toast("下载完成：" + (st.path || ""));
        } else if (st.status === "failed") {
          clearInterval(poll);
          if (btn) { btn.disabled = false; btn.innerHTML = icon("download", 13); }
          toast("下载失败：" + (st.log[st.log.length - 1] || ""));
        }
      } catch (e) { clearInterval(poll); toast(e.message); }
    }, 1500);
  } catch (e) { toast(e.message); }
}

let _queueState={bloggerId:null,bloggers:[],order:[],skip:new Set(),pending:[],items:[]};
async function renderQueue(refresh=true) {
  const bloggers=refresh?await api('/bloggers'):_queueState.bloggers;
  const bloggerId=_queueState.bloggerId||bloggers[0]?.id||null;
  const q=refresh ? await api('/queue'+(bloggerId?`?blogger_id=${encodeURIComponent(bloggerId)}`:'')) : {items:_queueState.items,todo:{order:_queueState.order,skip:[..._queueState.skip]}};
  const items = q.items || [];
  const todo = q.todo || {};
  let order = Array.isArray(todo.order) ? todo.order.map(Number) : [];
  let skip = new Set((Array.isArray(todo.skip) ? todo.skip : []).map(Number));
  let pending = items.filter(it => !it.done);
  if (order.length) pending.sort((a, b) => {
    const ai = order.indexOf(a.seq), bi = order.indexOf(b.seq);
    return (ai < 0 ? 999 + a.seq : ai) - (bi < 0 ? 999 + b.seq : bi);
  });
  _queueState = { bloggerId, bloggers, order, skip, pending, items };
  const row = (it, i) => `
    <div class="panel queue-row" style="padding:10px 14px;margin-top:8px;display:flex;align-items:center;gap:10px">
      <span class="pill ${skip.has(it.seq) ? "pill-muted" : "pill-ok"}" style="min-width:44px;text-align:center">#${it.seq}</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it.title || it.vid)}</div>
        <div class="last-updated" style="font-size:11px">${it.done ? "已转写" : "待转写"} · ${esc(it.vid)}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-sm" onclick="queueMove(${i},-1)">${icon("chevronL", 12)}</button>
        <button class="btn btn-sm" onclick="queueMove(${i},1)">${icon("chevronR", 12)}</button>
        <button class="btn btn-sm" onclick="queueSkip(${it.seq},${skip.has(it.seq)})">${skip.has(it.seq) ? "恢复" : "跳过"}</button>
      </div>
    </div>`;
  const doneItems = items.filter(it => it.done);
  $("#main").innerHTML = `
    <div class="crumbs">${icon("chevronL", 13)} <a href="#/">概览</a> / <a href="#/progress">采集进度</a> / <span>队列调控</span></div>
    <div class="panel" style="padding:16px 18px;max-width:820px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="section-title">转写队列</span>
        <select id="queue-blogger" class="ctl" style="max-width:220px" ${bloggers.length?'':'disabled'}>${bloggers.length?bloggers.map(b=>`<option value="${b.id}" ${Number(b.id)===Number(bloggerId)?'selected':''}>${esc(b.name)}</option>`).join(''):'<option>先添加博主</option>'}</select>
        <span style="flex:1"></span>
        <span class="last-updated">待转写 ${pending.length} / 已转写 ${doneItems.length}</span>
      </div>
      <div class="last-updated" style="margin-top:4px">用箭头调整先后顺序，跳过=本轮不转写；保存后重启流水线生效</div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn" onclick="queueSave()">${icon("save", 13)} 保存顺序</button>
        <button class="btn" onclick="location.reload()">${icon("refresh", 13)} 刷新</button>
      </div>
    </div>
    <div style="max-width:820px">
      ${pending.length ? pending.map(row).join("") : '<div class="panel" style="padding:20px;text-align:center;color:var(--text-muted)">全部转写完成 🎉</div>'}
    </div>
    <div class="panel" style="padding:14px 18px;max-width:820px;margin-top:12px">
      <div class="section-title" style="font-size:13px;margin-bottom:6px">已转写（${doneItems.length}）</div>
      <div class="last-updated" style="font-size:11px;line-height:1.8">${doneItems.map(i => `#${i.seq} ${esc(i.title || i.vid)}`).join(" · ")}</div>
    </div>`;
  $('#queue-blogger')?.addEventListener('change',event=>{_queueState.bloggerId=Number(event.target.value);renderQueue(true);});
  setStatus("ok", "正常");
}
function queueMove(i,dir){
  const p=[..._queueState.pending],j=i+dir;
  if(j<0||j>=p.length)return;
  [p[i],p[j]]=[p[j],p[i]];
  _queueState.order=p.map(x=>x.seq);renderQueue(false);
}

function queueSkip(seq,isSkipped){
  const skip=new Set(_queueState.skip);
  if(isSkipped)skip.delete(seq);else skip.add(seq);
  _queueState.skip=skip;renderQueue(false);
}

async function queueSave() {
  await api("/queue", { method: "PUT", body: JSON.stringify({ blogger_id:_queueState.bloggerId, order: _queueState.order, skip: [..._queueState.skip] }) });
  toast("队列已保存（重启流水线后生效）");
}

async function checkVersion(showToast=false) {

    const v = await api("/version");
    const banner = document.getElementById("updateBanner");
    if (!banner) return;
    if (v.is_old) {
      banner.style.display = "block";
      banner.innerHTML = `<div class="panel" style="background:linear-gradient(135deg,rgba(239,68,68,0.12),rgba(245,158,11,0.08));border-color:rgba(239,68,68,0.25);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span style="font-size:18px">🚀</span>
        <div style="flex:1;min-width:180px;text-align:left">
          <div style="font-weight:700;font-size:13px">发现新版本 v${esc(v.latest)}（当前 v${esc(v.current)}）</div>
          <div style="font-size:11px;color:var(--text-muted)">点击更新可直接跳转至 GitHub Release 下载最新安装包</div>
        </div>
        <button class="btn primary" onclick="window.open('${esc(v.url)}','_blank')">${icon("download", 13)} 去更新</button>
        <button class="btn" onclick="this.closest('#updateBanner').style.display='none'">${icon("x", 12)} 忽略</button>
      </div>`;
    } else if (showToast) {
      toast("已是最新版本 v" + v.current);
    }
  } catch (e) {
    if (showToast) toast("检查更新失败");
  }
}

const counted = new Set();
function countUp(el, target) {
  if (counted.has(el.id)) { el.textContent = target.toLocaleString("zh-CN"); return; }
  counted.add(el.id);
  const dur = Math.min(2600, Math.max(900, 600 + target * 0.06));
  const t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 3);
  function step(t) {
    const p = Math.min(1, (t - t0) / dur);
    el.textContent = Math.round(target * ease(p)).toLocaleString("zh-CN");
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

async function submitCollection(event) {

function watchCollection(id, openWhenDone) {
  clearTimeout(collectionTimer);
  const generation = ++collectionGeneration;
  const poll = async () => {
    if (generation !== collectionGeneration || location.hash.split('?')[0] !== '#/collect') return;
    const box = $('#collectionStatus'), fields = $('#collectionFields'), button = $('#collectionStart');
    if (!box) return;
    try {
      const task = await api('/collection/jobs/' + encodeURIComponent(id));
      if (generation !== collectionGeneration || location.hash.split('?')[0] !== '#/collect') return;
      box.style.display = 'block';
      const busy = ['queued','running'].includes(task.status);
      const login=task.kind==='douyin_login';
      if(busy&&!login&&task.range){
        $('#collectionLimit').value=task.range.limit||'';
        $('#collectionDateFrom').value=task.range.date_from||'';
        $('#collectionDateTo').value=task.range.date_to||'';
      }
      $('#collectionLogin').disabled=busy;
      fields.disabled = busy; button.textContent = busy ? '采集中…' : '开始采集';
      if(login&&busy)button.textContent='等待登录…';
      box.innerHTML = `<strong>${login?(busy?'等待登录':task.status==='done'?'登录状态已保存':'登录未完成'):(busy?'正在采集':task.status==='done'?'采集完成':'采集未完成')}</strong><p style="margin-top:8px;line-height:1.7;white-space:pre-wrap">${esc(task.message)}</p>${busy&&!login?`<p class="last-updated" style="margin-top:8px">已取得 ${Number(task.collected||0)} 条作品。可以切换页面，任务继续在后台运行。</p>`:''}`;
      if (busy) {
        setStatus('busy',login?'等待登录':'采集中');
        collectionTimer = setTimeout(poll, 1200);
      } else if (task.status === 'done') {
        setStatus('ok',login?'登录已更新':'采集完成');
        const result = task.result || {}, bid = Number(result.blogger_id);
        if (result.warning) { const note=document.createElement('p');note.textContent=result.warning;box.appendChild(note); }
        if (Number.isInteger(bid) && bid>0) {
          const link=document.createElement('a');link.className='btn';link.href='#/blogger/'+bid;link.textContent='查看已采集作品';link.style.marginTop='12px';box.appendChild(link);
          if (openWhenDone && !result.warning) { toast(task.message);location.hash=link.hash; }
        }
      } else {
        setStatus('err',login?'登录未完成':'采集失败');
        const link=document.createElement('a');link.href='#/settings';link.className='btn';link.textContent='打开设置';link.style.marginTop='12px';box.appendChild(link);
      }
    } catch (failure) {
      fields.disabled=false;button.textContent='开始采集';$('#collectionLogin').disabled=false;box.style.display='block';box.textContent='无法读取采集状态：'+failure.message;
    }
  };
  poll();
}

async function confirmMetricsImport(){

function metricsParams(){
  const ids=metricIds();
  metricsPageState.filters={q:$('#metricsQ').value.trim(),date_from:$('#metricsDateFrom').value,date_to:$('#metricsDateTo').value,
    min_duration:$('#metricsDurationMin').value,max_duration:$('#metricsDurationMax').value,kind:$('#metricsKind').value,
    min_likes:$('#metricsMinLikes').value,min_comments:$('#metricsMinComments').value,min_shares:$('#metricsMinShares').value,
    min_saves:$('#metricsMinSaves').value,sort:$('#metricsSort').value};
  const params={...metricsPageState.filters,limit:metricsPageState.limit,offset:metricsPageState.offset};
  if(metricsPageState.batchId){params.batch_id=Number(metricsPageState.batchId);params.creator_keys=ids.join(',');}
  else params.blogger_ids=ids.map(x=>x.startsWith('db:')?x.slice(3):x).join(',');
  return params;
}
function metricsQueryString(params,omitPage=false){const p=new URLSearchParams();for(const [k,v] of Object.entries(params))if(v!==''&&v!=null&&!(omitPage&&(k==='limit'||k==='offset')))p.set(k,String(v));return p.toString();}
async function runMetrics(reset){
  if(reset){metricsPageState.offset=0;metricsPageState.selectedVideos.clear();$('#metricsWorkCompare').innerHTML='';}
  const params=metricsParams(),box=$('#metricsTable');if(!box)return;
  box.innerHTML='<div class="empty">正在筛选所选数据…</div>';setStatus('busy','读取本地数据');
  try{const d=await api('/metrics?'+metricsQueryString(params));metricsPageState.data=d;renderMetricsData(d);setStatus('ok','正常');}
  catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`;setStatus('err','查询失败');}
}
function renderMetricSummary(summary,data){
  const root=$('#metricsSummary');if(!root)return;
  if(!summary?.length){root.innerHTML='';return;}
  const cell=(label,mean,max,known,zeros,missing)=>`<div class="metrics-stat"><div class="k">${label}</div><div class="v">均值 ${mean==null?'—':metricNum(Math.round(mean))} · 最高 ${max==null?'—':metricNum(max)}</div><div class="metrics-muted">${data?.nullable_metrics?`有值 ${metricNum(known)} 条（含真实0）；未提供 ${metricNum(missing)} 条`:`非0记录 ${metricNum(known)} 条；0/未知 ${metricNum(zeros)} 条`}</div></div>`;
  root.innerHTML=summary.map(s=>`<article class="panel metrics-summary-card"><h3>${esc(s.blogger_name||'未命名博主')}</h3><div class="meta">匹配作品 ${metricNum(s.sample_count)} 条 · ${esc(s.blogger_tags||(data?.source_mode==='imported'?'外部数据':'未标注分组'))}</div><div class="metrics-stats">${cell('点赞',s.likes_mean_positive,s.likes_max_positive,s.likes_positive_rows,s.likes_zero_rows,s.likes_missing_rows)}${cell('评论',s.comments_mean_positive,s.comments_max_positive,s.comments_positive_rows,s.comments_zero_rows,s.comments_missing_rows)}${cell('分享/转发',s.shares_mean_positive,s.shares_max_positive,s.shares_positive_rows,s.shares_zero_rows,s.shares_missing_rows)}${cell('收藏',s.saves_mean_positive,s.saves_max_positive,s.saves_positive_rows,s.saves_zero_rows,s.saves_missing_rows)}</div></article>`).join('');
}

  updateMetricControls();
}
function safeMetricLink(raw){try{const u=new URL(raw);return u.protocol==='https:'&&/(^|\.)douyin\.com$/i.test(u.hostname)?u.href:'';}catch(e){return '';}}
function exportFilteredMetrics(){const data=metricsPageState.data;if(!data){toast('请先筛选作品');return;}const params=metricsParams();window.location.href='/api/metrics/export.csv?'+metricsQueryString(params,true);}

  $('#metricsCloseWorkCompare').onclick=()=>$('#metricsWorkCompare').innerHTML='';
}
async function exportFilteredMetrics(){const data=metricsPageState.data;if(!data){toast('请先筛选作品');return;}try{const params=metricsParams();window.location.href='/api/metrics/export.csv?'+metricsQueryString(params,true);}catch(e){toast(e.message);}}
async function renderSearch(){
  const qs=new URLSearchParams(location.hash.split('?')[1]||'');contentSearch=qs.get('q')||contentSearch;
  $('#main').innerHTML=`<div class="crumbs"><a href="#/">概览</a> / 内容检索</div><div class="panel" style="padding:20px"><h2 style="font-size:18px">搜索已经收录的内容</h2><p style="color:var(--text-secondary);margin:8px 0 16px">跨博主搜索字幕、七项分析、标题和个人备注，查看命中出处。</p><form id="contentSearchForm" style="display:flex;gap:10px;flex-wrap:wrap"><label for="contentQuery" class="sr-only">内容关键词</label><input id="contentQuery" class="search-input" style="flex:1;min-width:220px" placeholder="输入一句原话、模型名或研究关键词" value="${esc(contentSearch)}"><button class="btn primary" type="submit">搜索</button></form></div><div id="contentResults" aria-live="polite" style="margin-top:16px"></div>`;
  $('#contentSearchForm').onsubmit=e=>{e.preventDefault();contentSearch=$('#contentQuery').value.trim();history.replaceState(null,'','#/search?q='+encodeURIComponent(contentSearch));runContentSearch();};
  if(contentSearch)runContentSearch();setStatus('ok','正常');
}
async function runContentSearch(){
  const box=$('#contentResults');box.textContent='正在搜索…';
  try{const d=await api('/search?q='+encodeURIComponent(contentSearch));box.innerHTML=`<div class="last-updated">找到 ${d.total} 条作品${d.total>d.items.length?'，先显示前 '+d.items.length+' 条':''}</div>`+d.items.map(x=>`<article class="panel" style="padding:18px;margin-top:10px"><a href="#/video/${x.id}" style="font-size:16px;font-weight:600">${esc(x.title||'无标题')}</a><div class="daily-meta">${esc(x.blogger)} · ${esc(fmtDate(x.date))}</div>${x.matches.map(m=>`<div style="margin-top:12px"><span class="provider-badge">${esc(m.source)}</span><p style="white-space:pre-wrap;line-height:1.7;margin-top:6px">${esc(m.snippet)}</p></div>`).join('')}</article>`).join('')+(d.total?'':'<div class="panel" style="padding:30px">没有找到，试试缩短关键词。</div>');}
  catch(e){box.textContent=e.message;}
}
</script>
</body>
</html>
